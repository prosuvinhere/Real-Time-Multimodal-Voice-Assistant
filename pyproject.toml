[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-voice-assistant"
version = "1.0.0"
description = "A real-time multimodal streaming voice assistant backend in Python with sub-800ms latency budgets."
readme = "README.md"
authors = [
    { name = "Suvin Singh" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = [
    "voice-assistant",
    "real-time",
    "multimodal",
    "deepgram",
    "elevenlabs",
    "openai",
    "streaming",
    "websockets",
    "low-latency",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Telephony",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "websockets>=12.0",
    "aiohttp>=3.9.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "openai>=1.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "black>=24.0.0",
]

[project.scripts]
voice-server = "server:run_server"
voice-replay = "replay_client:main"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.black]
line-length = 100
target-version = ['py39']
